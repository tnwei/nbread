[project]
name = "nbread"
version = "0.2.0dev"
description = "Read Jupyter notebooks from the command line"
readme = "README.md"
authors = [{name = "Tan, Nian Wei"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta"
]
dependencies = [
    "rich",
    "pygments",
    "html2text>=2025.4.15",
]

[project.scripts]
nbread = "nbread.cli:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
